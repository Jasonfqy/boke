{{ define "title" }}{{ .Title }} · {{ .Site.Title }}{{ end }}
{{ define "main" }}
<article class="post">
  <header>
    <h1>{{ .Title }}</h1>
    <p class="post-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
      {{ with .Params.author }} · {{ . }}{{ end }}
      {{ with .Params.tags }} · {{ delimit . ", " }}{{ end }}
    </p>
  </header>
  <div class="post-content">
    {{ .Content }}
  </div>
</article>
{{ end }}
